[project]
name = "bitpattern"
version = "0.2.0"
description = "Very large sets of floats, IP addresses and other structured data, backed by binary decision diagrams"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stef Lindall" }]
keywords = ["bdd", "binary decision diagram", "set", "bitmask", "cidr", "ieee754", "hypothesis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
# The module calls only three functions in the Mojo runtime library (aligned alloc,
# aligned free and fprintf), and later releases keep them.
dependencies = ["mojo-compiler>=1.2.0"]

[project.optional-dependencies]
hypothesis = ["hypothesis>=6"]

[project.urls]
Source = "https://github.com/bethebunny/bitpattern"
Issues = "https://github.com/bethebunny/bitpattern/issues"

[dependency-groups]
# hatchling so ty can check hatch_build.py.
dev = ["pytest>=8", "hypothesis>=6", "numpy>=2.1", "max>=26.7", "hatchling"]

[build-system]
requires = ["hatchling", "mojo-compiler==1.2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bitpattern"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist]
exclude = [".jj"]  # hatchling only skips .git

[tool.uv]
# uv rebuilds the extension when one of these changes.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "hatch_build.py" },
    { file = "src/**/*.mojo" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
extend-select = ["ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
# Naive datetimes are what the datetime codec encodes.
"bitpattern/codecs/time.py" = ["DTZ"]
"tests/codecs/test_time.py" = ["DTZ"]
