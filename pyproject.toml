[project]
name = "bitpattern"
dynamic = ["version"]
description = "Bit patterns and integer sets backed by binary decision diagrams"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stef Lindall" }]
keywords = ["bdd", "binary decision diagram", "set", "bitmask", "cidr", "ieee754", "hypothesis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
hypothesis = ["hypothesis>=6"]

[project.urls]
Source = "https://github.com/bethebunny/bitpattern"
Issues = "https://github.com/bethebunny/bitpattern/issues"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "bitpattern/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["bitpattern"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
extend-select = ["ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
